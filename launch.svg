<svg xmlns="http://www.w3.org/2000/svg" width="760" height="128" viewBox="0 0 760 128" role="img" aria-label="Launch mission notebook in Google Colab">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2233"/>
      <stop offset="1" stop-color="#07131f"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#31d8ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#31d8ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#31d8ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd56a"/>
      <stop offset=".6" stop-color="#ffb000"/>
      <stop offset="1" stop-color="#ffb000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#173244" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect x="4" y="4" width="752" height="120" rx="16"/></clipPath>
  </defs>

  <!-- panel -->
  <rect x="4" y="4" width="752" height="120" rx="16" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <rect x="4" y="4" width="752" height="120" fill="url(#grid)" opacity=".55"/>
    <rect x="-220" y="4" width="220" height="120" fill="url(#sweep)">
      <animate attributeName="x" values="-220;760" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- border: static + running dash -->
  <rect x="4" y="4" width="752" height="120" rx="16" fill="none" stroke="#2c566a" stroke-width="2"/>
  <rect x="4" y="4" width="752" height="120" rx="16" fill="none" stroke="#31d8ff" stroke-width="2.5"
        stroke-dasharray="120 1600" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="0;-1720" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- reactor icon -->
  <g transform="translate(70 64)">
    <circle r="34" fill="url(#core)" opacity=".35">
      <animate attributeName="r" values="30;38;30" dur="2s" repeatCount="indefinite"/>
    </circle>
    <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="#07131f" stroke="#ffd56a" stroke-width="2.5"/>
    <g>
      <circle r="21" fill="none" stroke="#31d8ff" stroke-width="2" stroke-dasharray="10 6"/>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="6s" repeatCount="indefinite"/>
    </g>
    <polygon points="-7,-11 13,0 -7,11" fill="#ffd56a"/>
  </g>

  <!-- text -->
  <text x="128" y="52" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="3" fill="#7fa3b8">MISSION CONTROL · STEP 01</text>
  <text x="128" y="84" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="700" letter-spacing="1.5" fill="#e7f5ff">LAUNCH NOTEBOOK</text>
  <text x="128" y="108" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#31d8ff">Open in Google Colab ↗</text>

  <!-- status -->
  <g transform="translate(628 64)">
    <rect x="-8" y="-20" width="112" height="40" rx="20" fill="#07131f" stroke="#7dffb7" stroke-opacity=".6" stroke-width="1.5"/>
    <circle cx="14" cy="0" r="6" fill="#7dffb7">
      <animate attributeName="opacity" values="1;.25;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="5" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="2" fill="#7dffb7">READY</text>
  </g>
</svg>
